<style>
:root{
  /* Layout: páginas em formatinho (13,5 × 20,5 cm) sobre a mesa; capa e contracapa sozinhas, miolo em pares abertos como revista.
     A página é papel impresso e não muda com o tema; só a mesa escurece no modo escuro. Impressão em duas cores + preto, tinta desbotada. */
  --desk:#cdc6b6;
  --desk-ink:#4b453c;
  --paper:#ebe3cd;
  --paper-shade:#ddd2b5;
  --ink:#25211d;
  --ink-soft:#5f574b;
  --red:#a24a33;
  --blue:#3f5a68;
  --mustard:#b38f3e;
  --spine:rgba(37,33,29,.30);
  --drop:rgba(37,33,29,.30);
  --f-display:'Alfa Slab One','Rockwell','Roboto Slab',Georgia,serif;
  --f-label:'Oswald','Arial Narrow','Helvetica Neue Condensed',Impact,sans-serif;
  --f-body:'PT Serif',Georgia,'Times New Roman',serif;
  --f-data:'VT323','Courier New',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --desk:#1c1a17; --desk-ink:#b8b09f; --drop:rgba(0,0,0,.6); color-scheme:dark }
}
:root[data-theme="dark"]{ --desk:#1c1a17; --desk-ink:#b8b09f; --drop:rgba(0,0,0,.6); color-scheme:dark }

*,*::before,*::after{ box-sizing:border-box }
html{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); background:var(--desk) }
body{ margin:0; background:var(--desk); color:var(--desk-ink); font:14px/1.4 var(--f-body) }
img,svg{ max-width:100% }

.mesa{
  display:flex; flex-direction:column; align-items:center; gap:44px;
  padding-block:28px 72px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.mesa-topo{
  width:100%; max-width:960px;
  display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 24px;
  font:500 12px/1.4 var(--f-label); letter-spacing:.14em; text-transform:uppercase;
  border-bottom:1px solid currentColor; padding-bottom:10px;
}
.mesa-topo strong{ font-weight:700 }
.mesa-topo a{ color:inherit }
.mesa-sobre{
  width:100%; max-width:960px; margin:-30px 0 0;
  font:italic 400 14px/1.45 var(--f-body); text-wrap:balance;
}
.faixa-teste{
  width:100%; max-width:960px; text-align:center; padding:8px 12px;
  font:700 12px/1.3 var(--f-label); letter-spacing:.2em; text-transform:uppercase;
  border:2px dashed currentColor;
}

.spread{ display:grid; grid-template-columns:minmax(0,480px); justify-content:center; gap:44px; width:100% }
@media (min-width:1010px){
  .spread:not(.solo){ grid-template-columns:repeat(2, minmax(0,480px)); gap:0 }
  /* as duas páginas abertas acompanham a mais alta, como numa revista de verdade */
  .spread:not(.solo) .page{ align-self:stretch }
  .spread:not(.solo) .page:first-child{ box-shadow:inset -26px 0 26px -22px var(--spine), -6px 16px 30px -14px var(--drop) }
  .spread:not(.solo) .page:last-child{ box-shadow:inset 26px 0 26px -22px var(--spine), 6px 16px 30px -14px var(--drop) }
}

/* ---------- a página ---------- */
.page{
  position:relative; width:100%; aspect-ratio:135/205;
  container-type:inline-size;
  display:flex; flex-direction:column;
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .22 0 0 0 0 .17 0 0 0 0 .10 0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(120,92,45,.13) 100%);
  box-shadow:0 16px 30px -14px var(--drop);
}
.pg{ flex:1; display:flex; flex-direction:column; gap:2.3cqw; padding:5.6cqw 6.2cqw 4.2cqw }

.runner{
  display:flex; justify-content:space-between; gap:2cqw;
  font:600 max(9px,2.15cqw)/1 var(--f-label); letter-spacing:.16em; text-transform:uppercase;
  border-bottom:.4cqw solid var(--ink); padding-bottom:1.3cqw;
}
.folio{
  margin-top:auto; display:flex; justify-content:space-between; align-items:baseline;
  font:500 max(9px,2.15cqw)/1 var(--f-label); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
  border-top:.22cqw solid var(--ink); padding-top:1.3cqw;
}
.folio b{ font:400 3.4cqw/1 var(--f-display); color:var(--ink); letter-spacing:0 }

.tarja{
  align-self:flex-start;
  font:600 max(9.5px,2.35cqw)/1 var(--f-label); letter-spacing:.17em; text-transform:uppercase;
  background:var(--ink); color:var(--paper); padding:1cqw 1.8cqw .9cqw;
}
.tarja.verm{ background:var(--red) }
.titulo{ margin:0; font:400 7.8cqw/1.02 var(--f-display); letter-spacing:-.005em; text-wrap:balance }
.titulo.g{ font-size:9cqw }
.olho{
  margin:0; font:italic 400 max(12px,3.35cqw)/1.36 var(--f-body);
  border-left:.9cqw solid var(--red); padding-left:2.4cqw;
}
.txt{ display:flex; flex-direction:column; gap:1.4cqw }
.txt p, .cols p{
  margin:0; font-size:max(12px,2.95cqw); line-height:1.44;
  text-align:justify; hyphens:auto; -webkit-hyphens:auto;
}
.capitular::first-letter{
  float:left; font-family:var(--f-display); font-size:3.5em; line-height:.82;
  padding:.06em .09em 0 0; color:var(--red);
}
.cols{ columns:2; column-gap:4.4cqw; column-rule:.22cqw solid var(--ink-soft) }
.cols p{ margin-bottom:1.6cqw; text-align:left; break-inside:avoid }

.nota-cab{
  display:inline-block; margin-right:.5em;
  font:700 max(10px,2.45cqw)/1 var(--f-label); letter-spacing:.12em; text-transform:uppercase; color:var(--red);
}
.ref{ display:flex; flex-wrap:wrap; gap:.6cqw 3cqw }
.ref a, a.ref-link{
  font:500 max(9.5px,2.2cqw)/1.35 var(--f-label); letter-spacing:.08em; text-transform:uppercase;
  color:var(--blue); text-decoration:none; border-bottom:.22cqw dotted var(--blue);
}
a.ref-link{ margin-right:2.4cqw }
a:hover{ color:var(--red); border-bottom-color:var(--red) }
a:focus-visible{ outline:2px solid var(--red); outline-offset:2px }

.quadro{ position:relative; border:.45cqw solid var(--ink); background:var(--paper-shade); padding:2.5cqw 3cqw 2.7cqw }
.quadro::after{
  content:""; position:absolute; inset:1.5cqw -1.6cqw -1.6cqw 1.5cqw; z-index:-1;
  background-image:radial-gradient(var(--ink) 32%, transparent 35%); background-size:1.25cqw 1.25cqw;
}
.quadro h3{ margin:0 0 1.2cqw; font:700 max(10px,2.55cqw)/1 var(--f-label); letter-spacing:.15em; text-transform:uppercase; color:var(--red) }
.quadro p{ margin:0; font-size:max(11.5px,2.75cqw); line-height:1.42; hyphens:auto; -webkit-hyphens:auto }
.quadro p + p{ margin-top:1cqw }

.legenda{ margin:0; font:italic 400 max(10.5px,2.4cqw)/1.35 var(--f-body); color:var(--ink-soft) }
.arte{ display:block; width:100%; height:auto; max-width:100% }

/* SVG */
.f-ink{fill:var(--ink)} .f-paper{fill:var(--paper)} .f-shade{fill:var(--paper-shade)}
.f-red{fill:var(--red)} .f-blue{fill:var(--blue)} .f-mus{fill:var(--mustard)} .f-none{fill:none}
.s-ink{stroke:var(--ink)} .s-red{stroke:var(--red)} .s-mus{stroke:var(--mustard)} .s-paper{stroke:var(--paper)} .s-blue{stroke:var(--blue)}
.t-slab{font-family:var(--f-display)} .t-label{font-family:var(--f-label); font-weight:600} .t-data{font-family:var(--f-data)}

/* ---------- capa ---------- */
.capa .pg{ gap:2.4cqw }
.capa-faixa{ display:flex; justify-content:space-between; font:600 max(9px,2.2cqw)/1 var(--f-label); letter-spacing:.16em; text-transform:uppercase }
.logo{
  margin:0; font:400 15.6cqw/.9 var(--f-display); letter-spacing:-.015em; text-align:center;
  color:var(--ink); text-shadow:.75cqw .75cqw 0 var(--red);
  border-block:.5cqw solid var(--ink); padding-block:2cqw 1.4cqw;
}
.slogan{ margin:-.6cqw 0 0; text-align:center; font:500 max(9.5px,2.4cqw)/1 var(--f-label); letter-spacing:.3em; text-transform:uppercase }
.capa-miolo{ display:grid; grid-template-columns:31cqw minmax(0,1fr); gap:2.8cqw; align-items:center }
.chamadas{ display:flex; flex-direction:column; gap:2.2cqw }
.chamada{ border-top:.35cqw solid var(--ink); padding-top:1.3cqw }
.chamada span{ display:block; font:700 max(9.5px,2.3cqw)/1 var(--f-label); letter-spacing:.14em; text-transform:uppercase; color:var(--red); margin-bottom:.8cqw }
.chamada p{ margin:0; font:700 max(11px,2.8cqw)/1.22 var(--f-body) }
.arte-capa{ position:relative }
.selo{
  position:absolute; right:-1cqw; top:-1cqw; width:17cqw; aspect-ratio:1; border-radius:50%;
  display:grid; place-content:center; text-align:center; transform:rotate(12deg);
  background:var(--mustard); color:var(--ink); border:.5cqw solid var(--ink);
  box-shadow:0 0 0 .8cqw var(--paper), 0 0 0 1.1cqw var(--ink);
  font:700 2cqw/1.05 var(--f-label); letter-spacing:.08em; text-transform:uppercase;
}
.selo b{ display:block; font:400 3.4cqw/1 var(--f-display); letter-spacing:0 }
.manchete{ text-align:center; display:flex; flex-direction:column; gap:1.2cqw }
.manchete h2{ margin:0; font:700 11.4cqw/.92 var(--f-label); letter-spacing:.01em; text-transform:uppercase; text-wrap:balance }
.manchete p{ margin:0; font:italic 400 max(12px,3.6cqw)/1.25 var(--f-body); text-wrap:balance }
.capa-pe{ margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; gap:3cqw }
.capa-pe p{ margin:0; font:500 max(9px,2.2cqw)/1.35 var(--f-label); letter-spacing:.1em; text-transform:uppercase }
.barras{ display:flex; flex-direction:column; align-items:center; gap:.6cqw; background:var(--paper); padding:1.2cqw 1.6cqw .8cqw; border:.25cqw solid var(--ink) }
.barras i{
  display:block; width:22cqw; height:8cqw;
  background:repeating-linear-gradient(90deg, var(--ink) 0 .45cqw, transparent .45cqw .8cqw, var(--ink) .8cqw 1.5cqw, transparent 1.5cqw 1.75cqw, var(--ink) 1.75cqw 1.95cqw, transparent 1.95cqw 2.5cqw, var(--ink) 2.5cqw 2.7cqw, transparent 2.7cqw 3.3cqw);
}
.barras span{ font:400 2.6cqw/1 var(--f-data); letter-spacing:.2em }

/* ---------- miolo ---------- */
.sumario{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1.1cqw }
.sumario li{ display:flex; align-items:baseline; gap:1.4cqw; font-size:max(11.5px,2.85cqw) }
.sumario li::after{ content:""; order:2; flex:1; border-bottom:.3cqw dotted var(--ink-soft) }
.sumario li span{ order:1 }
.sumario li b{ order:3; font:400 3.6cqw/1 var(--f-display); color:var(--red); min-width:4cqw; text-align:right }
.sumario em{ font-style:normal; font:600 max(9.5px,2.3cqw)/1 var(--f-label); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin-right:.5em }
.expediente{ margin:0; font:400 max(13px,3cqw)/1.1 var(--f-data); color:var(--ink-soft); text-transform:uppercase }

.tabela{ width:100%; border-collapse:collapse; font:400 max(14px,3.7cqw)/1.15 var(--f-data); font-variant-numeric:tabular-nums }
.tabela th{ font:600 max(9px,2.15cqw)/1 var(--f-label); letter-spacing:.12em; text-transform:uppercase; text-align:right; padding:0 0 1cqw; border-bottom:.3cqw solid var(--ink) }
.tabela th:first-child, .tabela td:first-child{ text-align:left }
.tabela td{ text-align:right; padding:.7cqw 0; border-bottom:.22cqw dashed var(--ink-soft) }
.tabela td.sobe{ color:var(--blue) }
.tabela td.desce{ color:var(--red) }
.tabela tr:last-child td{ border-bottom:0 }

.lado{ display:grid; grid-template-columns:42cqw minmax(0,1fr); gap:3.4cqw; align-items:center }
.lado.inv{ grid-template-columns:minmax(0,1fr) 38cqw }
.lado > div{ display:flex; flex-direction:column; gap:2cqw; min-width:0 }
.notas{ display:flex; flex-direction:column; gap:1.5cqw }
.notas p{ margin:0; font-size:max(12px,2.95cqw); line-height:1.42; hyphens:auto; -webkit-hyphens:auto; text-align:justify }

.empresa{
  display:inline-block; margin-right:.45em; padding:.4cqw 1cqw .3cqw;
  font:700 max(9.5px,2.2cqw)/1 var(--f-label); letter-spacing:.12em; text-transform:uppercase;
  border:.3cqw solid var(--ink); background:var(--paper);
}

.vozes{ display:flex; flex-direction:column; gap:2.4cqw }
.voz{ display:grid; grid-template-columns:11cqw minmax(0,1fr); gap:2.8cqw; align-items:start }
.avatar{
  width:11cqw; aspect-ratio:1; border-radius:50%; border:.4cqw solid var(--ink);
  display:grid; place-items:center; font:400 3.8cqw/1 var(--f-display); color:var(--paper);
  background-color:var(--blue);
  background-image:radial-gradient(var(--ink) 30%, transparent 34%); background-size:1.3cqw 1.3cqw;
  text-shadow:0 0 .6cqw var(--ink);
}
.avatar.c1{ background-color:var(--red) }
.avatar.c2{ background-color:var(--mustard) }
.voz h4{ margin:0 0 .6cqw; font:700 max(10px,2.5cqw)/1.1 var(--f-label); letter-spacing:.12em; text-transform:uppercase }
.voz h4 small{ font-weight:500; color:var(--ink-soft); letter-spacing:.08em }
.voz p{ margin:0 0 .8cqw; font-size:max(12px,2.9cqw); line-height:1.4 }

.leituras{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2.2cqw }
.leituras li{ display:grid; grid-template-columns:3cqw minmax(0,1fr); gap:2cqw }
.leituras li::before{ content:""; width:2.2cqw; height:2.2cqw; margin-top:1cqw; background:var(--red) }
.leituras a{ font:700 max(12px,3.05cqw)/1.25 var(--f-body); color:var(--ink); text-decoration:none; border-bottom:.25cqw dotted var(--ink-soft) }
.leituras span{ display:block; margin-top:.5cqw; font:500 max(9px,2.15cqw)/1.3 var(--f-label); letter-spacing:.1em; text-transform:uppercase; color:var(--blue) }

.perdeu{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2.4cqw }
.perdeu li{ border-top:.3cqw solid var(--ink); padding-top:1.6cqw }
.perdeu li span{ display:block; font:700 max(9.5px,2.3cqw)/1 var(--f-label); letter-spacing:.14em; text-transform:uppercase; color:var(--red); margin-bottom:1cqw }
.perdeu li p{ margin:0 0 .8cqw; font-size:max(12px,2.95cqw); line-height:1.42 }

.glossario{ margin:0; display:flex; flex-direction:column; gap:2.2cqw }
.glossario dt{ font:400 4.6cqw/1 var(--f-display); color:var(--ink) }
.glossario dt small{ font:600 max(9px,2.1cqw)/1 var(--f-label); letter-spacing:.14em; text-transform:uppercase; color:var(--red); margin-left:1.2cqw }
.glossario dd{ margin:.8cqw 0 0; font-size:max(12px,2.95cqw); line-height:1.42; border-left:.6cqw solid var(--mustard); padding-left:2.2cqw }

.anuncio{ border:.6cqw double var(--ink); padding:2.8cqw; display:grid; grid-template-columns:minmax(0,1fr) 20cqw; gap:2.4cqw; align-items:center; background:var(--paper) }
.anuncio h3{ margin:0 0 1cqw; font:700 5.4cqw/.95 var(--f-label); text-transform:uppercase; letter-spacing:.01em }
.anuncio h3 em{ font-style:normal; color:var(--red) }
.anuncio p{ margin:0; font-size:max(11.5px,2.75cqw); line-height:1.35 }
.cupom{ grid-column:1 / -1; border:.35cqw dashed var(--ink); padding:2cqw 2.4cqw; font:400 max(13px,3.2cqw)/1.35 var(--f-data); position:relative }
.cupom::before{ content:"✂"; position:absolute; top:-2.4cqw; left:3cqw; background:var(--paper); padding:0 1cqw; font-size:3.4cqw; line-height:1 }
.anuncio.grande{ grid-template-columns:1fr; text-align:center; padding:4cqw }
.anuncio.grande .arte{ width:46cqw; margin:0 auto }
.anuncio.grande h3{ font-size:7.4cqw }
.miudo{ margin:0; font:italic 400 max(10px,2.2cqw)/1.3 var(--f-body); color:var(--ink-soft) }

/* ---------- arquivo de edições ---------- */
.arquivo{ width:100%; max-width:720px; list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px }
.arquivo li{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 18px; align-items:baseline; border-bottom:1px solid currentColor; padding-bottom:12px }
.arquivo b{ font:400 22px/1 var(--f-display) }
.arquivo a{ color:inherit; font:700 16px/1.3 var(--f-body) }
.arquivo span{ grid-column:2; font:500 12px/1.3 var(--f-label); letter-spacing:.12em; text-transform:uppercase }

</style>
</head>

<main class="mesa">
  <div class="mesa-topo">
    <span><strong>Circuito</strong> · edições anteriores</span>
    <span><a href="index.html">Edição de hoje</a></span>
  </div>
  <p class="mesa-sobre">Revista diária de tecnologia em 5 minutos · de segunda a sábado, às 7h · grátis.</p>

  </ol>
</main>
